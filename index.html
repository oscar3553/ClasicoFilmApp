<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClasicoFilm TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background-color: #0c0c0c; color: #ffffff; overflow-x: hidden; user-select: none; }
        
        /* Cabecera y Buscador */
        .header-tv { display: flex; align-items: center; justify-content: space-between; padding: 15px 30px; background: linear-gradient(to bottom, #141414, #0c0c0c); }
        .logo-box img { height: 45px; object-fit: contain; }
        .search-box { width: 35%; position: relative; }
        .search-box input { width: 100%; padding: 10px 15px; background-color: #222; border: 2px solid #333; border-radius: 20px; color: white; font-size: 15px; outline: none; }
        .search-box input:focus { border-color: #e50914; box-shadow: 0 0 10px rgba(229, 9, 20, 0.5); }
        
        /* Sección Principal e Indicador */
        .main-info { padding: 10px 30px; display: flex; align-items: center; justify-content: space-between; }
        .status-title { font-size: 18px; color: #aaa; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Botón de Menú de Filtros */
        .btn-explorar { padding: 10px 20px; background-color: #e50914; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; outline: none; font-size: 14px; }
        .btn-explorar:focus { background-color: white; color: black; box-shadow: 0 0 12px white; }

        /* Panel Desplegable de Géneros y Décadas */
        .filter-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(12, 12, 12, 0.95); z-index: 100; padding: 40px; overflow-y: auto; }
        .filter-panel-content { max-width: 1000px; margin: 0 auto; }
        .filter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #222; padding-bottom: 15px; }
        .filter-header h2 { color: #e50914; }
        .btn-cerrar-panel { padding: 8px 15px; background-color: #333; color: white; border: none; border-radius: 3px; cursor: pointer; outline: none; }
        .btn-cerrar-panel:focus { background-color: white; color: black; }
        
        .filter-section-title { font-size: 16px; color: #888; margin: 20px 0 10px 0; text-transform: uppercase; letter-spacing: 1px; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .btn-filtro { padding: 12px; background-color: #1c1c1c; color: #ccc; border: 1px solid #333; border-radius: 4px; text-align: left; cursor: pointer; outline: none; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-filtro:focus { background-color: #e50914; color: white; border-color: white; transform: scale(1.03); }
        .btn-filtro.activo { border-left: 4px solid #e50914; background-color: #252525; color: white; }

        /* Catálogo de Películas */
        .catalog-container { padding: 10px 20px 40px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
        .movie-card { display: block; text-decoration: none; background-color: #141414; border-radius: 6px; overflow: hidden; border: 2px solid transparent; transition: transform 0.2s; outline: none; position: relative; }
        .movie-card img { width: 100%; height: 210px; object-fit: cover; background-color: #222; display: block; }
        .movie-card p { padding: 8px; font-size: 12px; color: #e0e0e0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
        .movie-card:focus { border-color: #e50914; transform: scale(1.06); box-shadow: 0 0 15px rgba(229, 9, 20, 0.7); z-index: 10; }
        .movie-card:focus p { color: white; background-color: #e50914; }

        /* REPRODUCTOR PANTALLA COMPLETA PERFECTO */
        .player-fullscreen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 9999; }
        .player-fullscreen iframe { width: 100%; height: 100%; border: none; }
        
        /* Botón de cerrar flotante e inteligente (Autohide) */
        .close-video-btn { position: absolute; top: 25px; right: 25px; width: 45px; height: 45px; background-color: rgba(229, 9, 20, 0.85); border: 2px solid white; border-radius: 50%; color: white; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; outline: none; transition: opacity 0.4s ease; z-index: 10000; box-shadow: 0 0 10px black; }
        .close-video-btn:focus { background-color: white; color: #e50914; transform: scale(1.1); box-shadow: 0 0 15px white; }
        .player-fullscreen.user-active .close-video-btn { opacity: 1; pointer-events: auto; }
        .player-fullscreen.user-inactive .close-video-btn { opacity: 0; pointer-events: none; }
    </style>
    <script src="cordova.js"></script>
</head>
<body>

    <div class="header-tv">
        <div class="logo-box">
            <img src="https://blogger.googleusercontent.com/img/a/AVvXsEgpLF6ROFXXw42soEaNVYLsA7ZPqgnzhGWN-id-bGZ0GfPbfeO08bxXlPv6KgdiOPMAOrsjOu8V-WXIUhlTYRYlU6KQthnIL0VcP1-D1l7CJImrszfdjCImWIMOMgoBYl5MwPot7B7SeRqyx3TzBUP2q1AXRgr_hS1zlGMPnh4VEMTvEz9Lq0f1AytDFWog=s158" alt="ClasicoFilm">
        </div>
        <div class="search-box">
            <input type="text" id="buscador-cine" placeholder="Buscar película por título..." autocomplete="off">
        </div>
    </div>

    <div class="main-info">
        <div id="estado-titulo" class="status-title">Conectando...</div>
        <button id="btn-abrir-menu" class="btn-explorar">📂 CATEGORÍAS Y DÉCADAS</button>
    </div>

    <div id="panel-filtros" class="filter-panel">
        <div class="filter-panel-content">
            <div class="filter-header">
                <h2>Explorar Catálogo</h2>
                <button id="btn-cerrar-panel" class="btn-cerrar-panel">Volver al Catálogo ✕</button>
            </div>
            
            <div class="filter-section-title">Filtrar por Género cinematográfico</div>
            <div id="grid-generos" class="filter-grid"></div>
            
            <div class="filter-section-title">Filtrar por Década / Época</div>
            <div id="grid-decadas" class="filter-grid"></div>
        </div>
    </div>

    <div id="catalogo-tv" class="catalog-container"></div>

    <div id="reproductor-pantalla-completa" class="player-fullscreen user-active">
        <button id="close-player-btn" class="close-video-btn" aria-label="Cerrar reproductor">✕</button>
        <div id="video-container-tv" style="width:100%; height:100%;"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
