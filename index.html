<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClasicoFilm TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #0c0c0c; color: #ffffff; overflow-x: hidden; user-select: none; }
        
        /* Cabecera */
        .header-tv { display: flex; align-items: center; justify-content: space-between; padding: 12px 30px; background: linear-gradient(to bottom, #141414, #0c0c0c); border-bottom: 1px solid #1a1a1a; }
        
        .logo-box { cursor: pointer; outline: none; border: 2px solid transparent; border-radius: 8px; padding: 4px 8px; display: flex; align-items: center; }
        .logo-box:focus { border-color: #e50914; background-color: #1c1c1c; }
        .logo-box img { height: 42px; object-fit: contain; }
        
        .search-box { width: 35%; position: relative; }
        .search-box input { width: 100%; padding: 10px 18px; background-color: #1c1c1c; border: 2px solid #333; border-radius: 25px; color: white; font-size: 15px; outline: none; }
        .search-box input:focus { border-color: #e50914; box-shadow: 0 0 12px rgba(229, 9, 20, 0.6); background-color: #222; }
        
        /* Controles Principales */
        .main-info { padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; background-color: #0c0c0c; }
        .status-title { font-size: 15px; color: #b3b3b3; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        .buttons-group-top { display: flex; gap: 12px; }
        .btn-explorar { padding: 10px 20px; background-color: #1c1c1c; color: white; border: 1px solid #333; border-radius: 25px; font-weight: bold; cursor: pointer; outline: none; font-size: 13px; }
        .btn-explorar.btn-rojo { background-color: #e50914; border: none; }
        .btn-explorar:focus { background-color: white; color: black; box-shadow: 0 0 15px white; transform: scale(1.03); }

        /* Panel de Filtros en Cuadrícula */
        .filter-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(8, 8, 8, 0.98); z-index: 100; padding: 30px; overflow-y: auto; }
        .filter-panel-content { max-width: 1100px; margin: 0 auto; }
        .filter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #222; padding-bottom: 10px; }
        .filter-header h2 { color: #e50914; font-size: 22px; }
        .btn-cerrar-panel { padding: 8px 16px; background-color: #222; color: white; border: 1px solid #444; border-radius: 20px; cursor: pointer; outline: none; font-weight: bold; }
        .btn-cerrar-panel:focus { background-color: white; color: black; }
        
        .filter-section-title { font-size: 13px; color: #e50914; margin: 20px 0 10px 0; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; border-left: 3px solid #e50914; padding-left: 10px; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
        .btn-filtro { padding: 12px; background-color: #141414; color: #ccc; border: 1px solid #262626; border-radius: 8px; text-align: left; cursor: pointer; outline: none; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-filtro:focus { background-color: #e50914; color: white; border-color: white; transform: scale(1.02); }
        .btn-filtro.activo { border-left: 4px solid #e50914; background-color: #222; color: white; font-weight: bold; }

        /* SOLUCIÓN: FICHA TÉCNICA RE-DISEÑADA COMPACTA SIN SCROLL (ANTI-CORTES) */
        .details-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(4, 4, 4, 0.95); z-index: 500; align-items: center; justify-content: center; padding: 20px; }
        
        .details-content { 
            background-color: #161616; 
            border-radius: 12px; 
            border: 1px solid #2c2c2c; 
            max-width: 860px; 
            width: 100%; 
            height: 85vh; /* Forzamos altura máxima controlada */
            display: flex; 
            overflow: hidden; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); 
            position: relative; 
            animation: fadeIn 0.2s ease-out;
        }
        
        .details-poster { width: 35%; background-color: #111; display: flex; align-items: center; justify-content: center; border-right: 1px solid #222; height: 100%; }
        .details-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* Contenedor derecho ajustado para no generar desbordamiento */
        .details-info { width: 65%; padding: 20px 25px; display: flex; flex-direction: column; justify-content: space-between; height: 100%; overflow: hidden; }
        
        /* El título ahora tiene espacio garantizado */
        .details-info h2 { font-size: 20px; color: #ffffff; font-weight: bold; line-height: 1.3; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .ficha-datos-container { background: #1c1c1c; border-radius: 8px; padding: 10px 15px; margin-bottom: 10px; border: 1px solid #262626; }
        .ficha-linea { font-size: 13px; color: #dcdcdc; margin-bottom: 6px; display: flex; align-items: center; }
        .ficha-linea:last-child { margin-bottom: 0; }
        .ficha-linea strong { color: #e50914; width: 90px; flex-shrink: 0; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        
        .details-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag-badge { background-color: #2b2b2b; color: #ffffff; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        
        /* Botonera compactada para que entre 100% en la pantalla */
        .details-actions-box { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: auto; }
        .btn-action-play { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; outline: none; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; text-transform: uppercase; }
        .btn-action-play.odysee { background-color: #ef5350; }
        .btn-action-play.dzenru { background-color: #2196f3; }
        .btn-action-play.generic { background-color: #388e3c; }
        .btn-action-play:focus { border: 2px solid white; transform: scale(1.01); box-shadow: 0 0 10px white; }
        
        .btn-action-close { background-color: #2b2b2b; color: #e0e0e0; }
        .btn-action-close:focus { background-color: white; color: black; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* Catálogo de Películas */
        .catalog-container { padding: 10px 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        
        .movie-card { 
            display: block; 
            text-decoration: none; 
            background-color: #141414; 
            border-radius: 8px; 
            overflow: hidden; 
            border: 2px solid transparent; 
            transition: transform 0.2s ease, border-color 0.2s, box-shadow 0.2s; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            outline: none; 
            position: relative;
        }
        
        /* Efecto esqueleto sutil */
        .movie-card.loading-skeleton {
            background: linear-gradient(90deg, #141414 25%, #1c1c1c 50%, #141414 75%);
            background-size: 200% 100%;
            animation: skeleton-blink 1.5s infinite;
        }
        @keyframes skeleton-blink {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* SOLUCIÓN AL FONDO NEGRO: Imagen visible inmediatamente */
        .movie-card img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
            display: block; 
            border-radius: 6px 6px 0 0; 
        }
        
        .movie-card p { padding: 8px; font-size: 12px; color: #cccccc; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
        .movie-card:focus, .movie-card:hover { border-color: #e50914; transform: scale(1.05); box-shadow: 0 0 15px rgba(229, 9, 20, 0.6); z-index: 10; }
        .movie-card:focus p, .movie-card:hover p { color: white; background-color: #e50914; }

        /* Barra de Paginación */
        .pagination-bar { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 25px 20px 40px 20px; background-color: #0c0c0c; }
        .btn-page-nav { padding: 10px 18px; background-color: #1c1c1c; color: white; border: 1px solid #333; border-radius: 25px; font-weight: bold; font-size: 13px; cursor: pointer; outline: none; }
        .btn-page-nav.btn-small { padding: 10px 14px; color: #888; }
        .btn-page-nav:focus { background-color: white; color: black; }
        .btn-page-nav:disabled { opacity: 0.15; pointer-events: none; }
        .page-indicator { font-size: 13px; font-weight: bold; color: #888; }
        .page-indicator span { color: #ffffff; }

        /* Reproductor Fullscreen */
        .player-fullscreen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 99999; flex-direction: column; }
        #video-container-tv { width: 100%; height: 88vh; }
        #video-container-tv iframe { width: 100%; height: 100%; border: none; }
        .bottom-control-bar { width: 100%; height: 12vh; background-color: #111; border-top: 2px solid #222; display: flex; align-items: center; justify-content: center; }
        .close-video-btn { padding: 10px 30px; background-color: #e50914; border: 2px solid white; border-radius: 25px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; outline: none; }
        .close-video-btn:focus { background-color: white; color: #e50914; }

        @media (max-width: 768px) {
            .details-content { flex-direction: column; height: 90vh; }
            .details-poster { width: 100%; height: 35%; border-right: none; }
            .details-info { width: 100%; height: 65%; padding: 15px; }
            .header-tv { flex-direction: column; gap: 10px; }
            .search-box { width: 100%; }
        }
    </style>
    <script src="cordova.js"></script>
</head>
<body>

    <div class="header-tv">
        <div class="logo-box" id="btn-logo-inicio" tabindex="0">
            <img src="https://blogger.googleusercontent.com/img/a/AVvXsEgpLF6ROFXXw42soEaNVYLsA7ZPqgnzhGWN-id-bGZ0GfPbfeO08bxXlPv6KgdiOPMAOrsjOu8V-WXIUhlTYRYlU6KQthnIL0VcP1-D1l7CJImrszfdjCImWIMOMgoBYl5MwPot7B7SeRqyx3TzBUP2q1AXRgr_hS1zlGMPnh4VEMTvEz9Lq0f1AytDFWog=s158" alt="ClasicoFilm">
        </div>
        <div class="search-box">
            <input type="text" id="buscador-cine" placeholder="Buscar película por título..." autocomplete="off">
        </div>
    </div>

    <div class="main-info">
        <div id="estado-titulo" class="status-title">Conectando...</div>
        <div class="buttons-group-top">
            <button id="btn-reset-inicio" class="btn-explorar">🏠 INICIO</button>
            <button id="btn-abrir-menu" class="btn-explorar btn-rojo">📂 CATEGORÍAS</button>
        </div>
    </div>

    <div id="panel-filtros" class="filter-panel">
        <div class="filter-panel-content">
            <div class="filter-header">
                <h2>Explorar Catálogo</h2>
                <button id="btn-cerrar-panel" class="btn-cerrar-panel">Volver ✕</button>
            </div>
            <div class="filter-section-title">Filtrar por Género</div>
            <div id="grid-generos" class="filter-grid"></div>
            <div class="filter-section-title">Filtrar por Década</div>
            <div id="grid-decadas" class="filter-grid"></div>
        </div>
    </div>

    <!-- MODAL CORREGIDO COMPACTO -->
    <div id="modal-ficha-tecnica" class="details-modal">
        <div class="details-content">
            <div class="details-poster">
                <img id="ficha-poster" src="" alt="Poster">
            </div>
            <div class="details-info">
                <!-- TÍTULO VISIBLE COMPLETO -->
                <h2 id="ficha-titulo">Título</h2>
                
                <div class="ficha-datos-container">
                    <div class="ficha-linea">
                        <strong>Año:</strong>
                        <span id="ficha-dato-ano">-</span>
                    </div>
                    <div class="ficha-linea">
                        <strong>Género:</strong>
                        <div id="ficha-tags" class="details-tags"></div>
                    </div>
                </div>

                <div class="details-actions-box">
                    <div id="ficha-contenedor-servidores" style="display: flex; flex-direction: column; gap: 8px; width: 100%;"></div>
                    <button class="btn-action-play btn-action-close" id="btn-cerrar-ficha">❌ Volver al menú</button>
                </div>
            </div>
        </div>
    </div>

    <div id="catalogo-tv" class="catalog-container"></div>

    <div class="pagination-bar">
        <button id="btn-page-first" class="btn-page-nav btn-small">⏮️</button>
        <button id="btn-page-prev" class="btn-page-nav">⬅️ Ant.</button>
        <div class="page-indicator">PÁG. <span id="txt-page-actual">1</span> DE <span id="txt-page-total">1</span></div>
        <button id="btn-page-next" class="btn-page-nav">Sig. ➡️</button>
        <button id="btn-page-last" class="btn-page-nav btn-small">⏭️</button>
    </div>

    <div id="reproductor-pantalla-completa" class="player-fullscreen">
        <div id="video-container-tv"></div>
        <div class="bottom-control-bar">
            <button id="close-player-btn" class="close-video-btn">⬅️ VOLVER AL CATÁLOGO</button>
        </div>
    </div>

    <script src="index.js?v=5"></script>
</body>
</html>
