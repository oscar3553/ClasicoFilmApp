<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClasicoFilm TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #0c0c0c; color: #ffffff; overflow-x: hidden; user-select: none; }
        
        /* Cabecera Premium */
        .header-tv { display: flex; align-items: center; justify-content: space-between; padding: 15px 30px; background: linear-gradient(to bottom, #141414, #0c0c0c); border-bottom: 1px solid #1a1a1a; }
        .logo-box img { height: 45px; object-fit: contain; }
        .search-box { width: 35%; position: relative; }
        .search-box input { width: 100%; padding: 10px 18px; background-color: #1c1c1c; border: 2px solid #333; border-radius: 25px; color: white; font-size: 15px; outline: none; transition: all 0.3s; }
        .search-box input:focus { border-color: #e50914; box-shadow: 0 0 12px rgba(229, 9, 20, 0.6); background-color: #222; }
        
        /* Controles Principales */
        .main-info { padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; background-color: #0c0c0c; }
        .status-title { font-size: 16px; color: #b3b3b3; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .btn-explorar { padding: 12px 24px; background-color: #e50914; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; outline: none; font-size: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: all 0.2s; }
        .btn-explorar:focus { background-color: white; color: black; box-shadow: 0 0 15px white; transform: scale(1.03); }

        /* Panel Desplegable de Filtros (Categorías) */
        .filter-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(8, 8, 8, 0.97); z-index: 100; padding: 40px; overflow-y: auto; }
        .filter-panel-content { max-width: 1100px; margin: 0 auto; }
        .filter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #222; padding-bottom: 15px; }
        .filter-header h2 { color: #e50914; font-size: 24px; }
        .btn-cerrar-panel { padding: 10px 20px; background-color: #222; color: white; border: 1px solid #444; border-radius: 20px; cursor: pointer; outline: none; font-weight: bold; }
        .btn-cerrar-panel:focus { background-color: white; color: black; }
        
        .filter-section-title { font-size: 15px; color: #888; margin: 25px 0 12px 0; text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .btn-filtro { padding: 12px; background-color: #141414; color: #bbb; border: 1px solid #262626; border-radius: 6px; text-align: left; cursor: pointer; outline: none; font-size: 14px; transition: all 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-filtro:focus { background-color: #e50914; color: white; border-color: white; transform: scale(1.04); }
        .btn-filtro.activo { border-left: 4px solid #e50914; background-color: #1f1f1f; color: white; font-weight: bold; }

        /* PANTALLA DE DETALLES / FICHA TÉCNICA */
        .details-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(5, 5, 5, 0.96); z-index: 500; align-items: center; justify-content: center; padding: 20px; }
        .details-content { background-color: #141414; border-radius: 12px; border: 1px solid #282828; max-width: 750px; width: 100%; display: flex; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.7); position: relative; animation: fadeIn 0.3s ease-out; }
        
        .details-poster { width: 35%; background-color: #222; display: flex; align-items: center; justify-content: center; }
        .details-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .details-info { width: 65%; padding: 35px; display: flex; flex-direction: column; justify-content: space-between; }
        .details-info h2 { font-size: 24px; color: #ffffff; margin-bottom: 12px; font-weight: bold; line-height: 1.3; }
        
        .details-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 25px; max-height: 80px; overflow-y: auto; }
        .tag-badge { background-color: #262626; color: #b3b3b3; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        
        .details-actions-box { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
        .btn-action-play { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; outline: none; display: flex; align-items: center; justify-content: center; gap: 10px; color: white; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-action-play.odysee { background-color: #ef5350; box-shadow: 0 4px 10px rgba(239, 83, 80, 0.3); }
        .btn-action-play.dzenru { background-color: #2196f3; box-shadow: 0 4px 10px rgba(33, 150, 243, 0.3); }
        .btn-action-play.generic { background-color: #388e3c; box-shadow: 0 4px 10px rgba(56, 142, 60, 0.3); }
        .btn-action-play:focus { border: 2px solid white; transform: scale(1.03); box-shadow: 0 0 15px white; }
        
        .btn-action-close { background-color: #333333; }
        .btn-action-close:focus { background-color: white; color: black; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* Catálogo de Películas Estilizado con Bordes Redondeados Reales */
        .catalog-container { padding: 10px 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 24px; min-height: 50vh; }
        
        .movie-card { 
            display: block; 
            text-decoration: none; 
            background-color: #141414; 
            border-radius: 12px !important; /* Fuerza las esquinas redondeadas en la tarjeta */
            overflow: hidden; 
            border: 2px solid transparent; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 5px 12px rgba(0,0,0,0.5); 
            outline: none; 
        }
        .movie-card img { 
            width: 100%; 
            height: 230px; 
            object-fit: cover; 
            background-color: #1f1f1f; 
            display: block; 
            border-radius: 10px 10px 0 0; /* Redondea la imagen arriba */
        }
        .movie-card p { padding: 10px 8px; font-size: 12px; color: #cccccc; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
        
        .movie-card:focus { border-color: #e50914; transform: scale(1.06); box-shadow: 0 0 20px rgba(229, 9, 20, 0.6); z-index: 10; }
        .movie-card:focus p { color: white; background-color: #e50914; }

        /* CONTROLLER DE PAGINACIÓN REAL (ANTERIOR / SIGUIENTE) */
        .pagination-bar { display: flex; align-items: center; justify-content: center; gap: 25px; padding: 40px 20px 60px 20px; background-color: #0c0c0c; }
        .btn-page-nav { padding: 12px 28px; background-color: #1c1c1c; color: white; border: 1px solid #333; border-radius: 25px; font-weight: bold; font-size: 14px; cursor: pointer; outline: none; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-page-nav:focus { background-color: white; color: black; border-color: white; transform: scale(1.05); }
        .btn-page-nav:disabled { opacity: 0.2; cursor: not-allowed; pointer-events: none; }
        .page-indicator { font-size: 15px; font-weight: bold; color: #888; letter-spacing: 0.5px; }
        .page-indicator span { color: #ffffff; }

        /* REPRODUCTOR */
        .player-fullscreen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 99999; flex-direction: column; }
        #video-container-tv { width: 100%; height: 88vh; background-color: black; }
        #video-container-tv iframe { width: 100%; height: 100%; border: none; }
        
        .bottom-control-bar { width: 100%; height: 12vh; background-color: #111; border-top: 2px solid #222; display: flex; align-items: center; justify-content: center; padding: 5px 0; }
        .close-video-btn { padding: 12px 40px; background-color: #e50914; border: 2px solid white; border-radius: 25px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; outline: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase; letter-spacing: 0.5px; }
        .close-video-btn:focus { background-color: white; color: #e50914; transform: scale(1.05); box-shadow: 0 0 15px white; }

        @media (max-width: 600px) {
            .details-content { flex-direction: column; max-height: 90vh; overflow-y: auto; }
            .details-poster { width: 100%; height: 200px; }
            .details-info { width: 100%; padding: 20px; }
            .header-tv { flex-direction: column; gap: 12px; padding: 15px; }
            .search-box { width: 100%; }
        }
    </style>
    <script src="cordova.js"></script>
</head>
<body>

    <div class="header-tv">
        <div class="logo-box">
            <img src="https://blogger.googleusercontent.com/img/a/AVvXsEgpLF6ROFXXw42soEaNVYLsA7ZPqgnzhGWN-id-bGZ0GfPbfeO08bxXlPv6KgdiOPMAOrsjOu8V-WXIUhlTYRYlU6KQthnIL0VcP1-D1l7CJImrszfdjCImWIMOMgoBYl5MwPot7B7SeRqyx3TzBUP2q1AXRgr_hS1zlGMPnh4VEMTvEz9Lq0f1AytDFWog=s158" alt="ClasicoFilm">
        </div>
        <div class="search-box">
            <input type="text" id="buscador-cine" placeholder="Buscar película por título..." autocomplete="off">
        </div>
    </div>

    <div class="main-info">
        <div id="estado-titulo" class="status-title">Conectando...</div>
        <button id="btn-abrir-menu" class="btn-explorar">📂 CATEGORÍAS Y DÉCADAS</button>
    </div>

    <div id="panel-filtros" class="filter-panel">
        <div class="filter-panel-content">
            <div class="filter-header">
                <h2>Explorar Catálogo</h2>
                <button id="btn-cerrar-panel" class="btn-cerrar-panel">Volver al Catálogo ✕</button>
            </div>
            <div class="filter-section-title">Filtrar por Género cinematográfico</div>
            <div id="grid-generos" class="filter-grid"></div>
            <div class="filter-section-title">Filtrar por Década / Época</div>
            <div id="grid-decadas" class="filter-grid"></div>
        </div>
    </div>

    <!-- MODAL DE DETALLES -->
    <div id="modal-ficha-tecnica" class="details-modal">
        <div class="details-content">
            <div class="details-poster">
                <img id="ficha-poster" src="" alt="Poster">
            </div>
            <div class="details-info">
                <div>
                    <h2 id="ficha-titulo">Título de la Película</h2>
                    <div id="ficha-tags" class="details-tags"></div>
                </div>
                <div class="details-actions-box">
                    <div id="ficha-contenedor-servidores" style="display: flex; flex-direction: column; gap: 10px; width: 100%;"></div>
                    <button class="btn-action-play btn-action-close" id="btn-cerrar-ficha">❌ Cerrar Ficha</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Rejilla del Catálogo -->
    <div id="catalogo-tv" class="catalog-container"></div>

    <!-- BARRA DE PAGINACIÓN ACTUALIZADA -->
    <div class="pagination-bar">
        <button id="btn-page-prev" class="btn-page-nav">⬅️ Anterior</button>
        <div class="page-indicator">PÁGINA <span id="txt-page-actual">1</span> DE <span id="txt-page-total">1</span></div>
        <button id="btn-page-next" class="btn-page-nav">Siguiente ➡️</button>
    </div>

    <!-- Contenedor del Reproductor -->
    <div id="reproductor-pantalla-completa" class="player-fullscreen">
        <div id="video-container-tv"></div>
        <div class="bottom-control-bar">
            <button id="close-player-btn" class="close-video-btn">⬅️ VOLVER AL CATÁLOGO</button>
        </div>
    </div>

    <!-- AGREGADO PARÁMETRO DE VERSIÓN v=2 PARA FORZAR AL MÓVIL A BORRAR LA CACHÉ VIEJA -->
    <script src="index.js?v=2"></script>
</body>
</html>
